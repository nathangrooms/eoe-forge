name: Daily prices

# Records what every card is worth today, records what every collection is worth
# today, and then rewrites the homepage's data file from the result.
#
# The homepage job is last on purpose. It is a snapshot of the card table, so it
# has to run AFTER the catalogue sync (the "Nightly card catalogue" workflow,
# 04:30, done by 06:00) or it would publish what was there yesterday; and after
# the two price steps above, or the prices on its cards and the chart in its
# marketplace section would be a day behind the rest of the file.
#
# Why GitHub Actions rather than a job inside the database: this project already
# lost six months to a price job that stopped on 2026-02-20 and told nobody. The
# database has no run history a person will look at, no failure email and no
# re-run button. This has all three.

on:
  schedule:
    # 06:20 UTC. Scryfall refreshes prices once a day, and the catalogue job
    # supervises from 04:30 for at most ninety minutes, so it is done by 06:00
    # and cards.prices is today's by the time this reads it. Step one does not
    # depend on that anyway: it takes prices from Scryfall's bulk file directly,
    # which is why it covers printings the catalogue has not reached yet.
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Cards per page. Lower it if the database is busy.'
        required: false
        default: '1000'
      chunk:
        description: 'Rows per write in the bulk file step. Lower it if writes time out.'
        required: false
        default: '1000'

# Never two price runs at once. They share a staging table.
concurrency:
  group: prices-daily
  cancel-in-progress: false

# Read-only by default, and each job widens it for itself.
#
# Only one of the four jobs writes to the repository and only one opens an
# issue. Declaring `contents: write` up here would hand a push token to the two
# jobs that carry the Supabase service role key as well, for no reason.
permissions:
  contents: read

jobs:
  snapshot:
    name: Card prices
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step one: today's price for EVERY PRINTING, from Scryfall's one daily
      # bulk file. It goes first because it is the only place today's price
      # exists for printings the catalogue sync has not reached. Measured
      # 2026-08-19: 101,587 priced paper printings in the file against 56,504
      # rows in `cards`. Waiting for the catalogue would throw those days away,
      # and the clock only ever runs forwards.
      #
      # One 74 MB download replaces about 100,000 API calls, which is what
      # Scryfall's rate limit page requires of anyone at this volume.
      # The dispatch inputs go through the environment, never through the
      # command line. A ${{ }} expression in a `run:` block is pasted into the
      # shell before the shell ever sees it, so whatever somebody typed into the
      # box on the Actions page would run as a command with the service role key
      # already in the environment. Through env, it is a string.
      - name: Record every printing from the Scryfall bulk file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHUNK: ${{ inputs.chunk || '1000' }}
        run: node scripts/prices/daily-sweep.mjs --chunk "$CHUNK"

      # Step two: the tier 1 guarantee, and anything the file did not cover.
      # Both steps write through apply_price_sweep, so they share one definition
      # of "the price moved" and cannot disagree with each other. Running this
      # after the bulk step is cheap: most cards already have today's row and
      # the gate skips them.
      - name: Record today's prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BATCH: ${{ inputs.batch || '1000' }}
        run: node scripts/data/pipeline.mjs price-snapshot --batch "$BATCH"

  collection-value:
    name: Collection values
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: snapshot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record what every collection is worth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/data/pipeline.mjs collection-value

  homepage-snapshot:
    name: Homepage snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [snapshot, collection-value]

    # The only job that writes to the repository.
    permissions:
      contents: write

    # `needs` is here for ORDER, not for permission, so it must not become a
    # veto. Without this line a failed price step would also stop the homepage
    # being refreshed, and the two are barely related: the card counts and the
    # cards themselves come from `cards` / `cards_unique`, which the catalogue
    # sync fills at 04:30 and neither job above touches. Only the marketplace
    # chart reads `card_price_history`, and a chart missing its newest day is a
    # far smaller problem than a homepage that quietly stops updating, starts
    # warning builds at three days and starts FAILING them at fourteen because
    # of an unrelated outage.
    #
    # `!cancelled()` rather than `always()`: a cancelled run should stay
    # cancelled instead of pushing a commit on the way out.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Runs every query the homepage used to make from the browser — 27 of them
      # before a visitor had scrolled at all, 48 by the bottom of the page, on
      # every anonymous visit — and writes the answers to one file.
      #
      # The service role is required for one figure: the exact count over
      # `cards` measures 7,586 ms and the anon role a visitor holds is capped at
      # 3 s, which is the bug this whole file exists to remove.
      - name: Rebuild the homepage's data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --experimental-strip-types scripts/homepage-snapshot.mjs

      # One path, every night, even when the figures happen to be identical.
      #
      # The obvious optimisation is to skip the commit when only `generatedAt`
      # moved, and it is wrong: `generatedAt` is the claim "these figures were
      # true at this moment", and the build's staleness check reads it to decide
      # whether the homepage is still current. Freezing the timestamp on a quiet
      # night would make a HEALTHY pipeline look like a dead one, and at
      # fourteen days it would start failing builds. A static file is a cheap
      # deploy; a false staleness alarm is not.
      #
      # Rebased before pushing because Lovable also commits to main.
      - name: Commit it
        run: |
          set -euo pipefail
          git config user.name 'deckmatrix-pipeline'
          git config user.email 'pipeline@deckmatrix.com'

          if git diff --quiet -- src/data/homepage-snapshot.json; then
            echo 'Nothing written. The generator refused, or the file is byte-identical.'
            exit 0
          fi

          git add src/data/homepage-snapshot.json
          git commit -m "Homepage data for $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt ${attempt} lost a race. Retrying."
            sleep $((attempt * 10))
          done
          echo 'Could not push after three attempts.'
          exit 1

  tell-someone:
    name: Raise an issue if it failed
    runs-on: ubuntu-latest
    needs: [snapshot, collection-value, homepage-snapshot]
    if: failure()

    # The only job that opens an issue.
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'The nightly data jobs did not run';
            const body = [
              'The nightly price and homepage job failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'While this is failing, price history has a hole in it and nothing else will tell you.',
              'The homepage also stops being refreshed: it reads a committed file, so it will keep',
              'showing the card counts and cards from the last successful run. The build warns from',
              'three days and refuses to run at fourteen, so this cannot go unnoticed forever.',
              'The job is safe to re-run: it picks up from where it stopped and never writes a day twice.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'data-pipeline',
            });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['data-pipeline'],
              });
            }
